name: Refresh league data

# 8:00 AM Eastern daily (12:00 UTC) — standings and the record book only really
# move on Tuesdays, but power rankings follow roster moves, so this runs every day.
# Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull league history from Sleeper
        run: node scripts/build-history.mjs

      # KeepTradeCut builds its league board in the browser, so mirroring it
      # needs a real one. Installed here rather than committed to the repo.
      - name: Install headless Chromium
        run: |
          npm install playwright --no-save --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Mirror the KeepTradeCut power rankings
        run: node scripts/build-power.mjs

      # Someone editing the repo while this runs would otherwise lose the push
      # to a non-fast-forward; rebase and retry instead of failing the job.
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- history.json power.json; then
            echo "Nothing moved today."
            exit 0
          fi
          git config user.name "league-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json power.json
          git commit -m "Refresh league data ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push raced with another commit — retrying ($attempt of 3)."
            sleep 5
          done
          echo "::error::Could not push the refreshed data after three attempts"
          exit 1
